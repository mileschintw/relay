name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Path tiers: a pull request runs only the jobs whose paths it changes; one that changes none
  # (docs, README, images) has them skipped, and a skipped job still reports a passing check.
  # A push to main runs every job.
  changes:
    runs-on: ubuntu-latest
    outputs:
      test: ${{ steps.paths.outputs.test }}
      validate: ${{ steps.paths.outputs.validate }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: paths
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "test=true" >> "$GITHUB_OUTPUT"
            echo "validate=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # HEAD is the PR's merge commit; its first parent is the base branch tip
          files=$(git diff --name-only --no-renames HEAD^1 HEAD)
          echo "$files"
          if grep -qE '^(plugin/tools/|plugin/skills/setup/templates/|tests/|\.github/workflows/)' <<< "$files"; then
            echo "test=true" >> "$GITHUB_OUTPUT"
          fi
          if grep -qE '^(plugin/|\.claude-plugin/|\.github/workflows/)' <<< "$files"; then
            echo "validate=true" >> "$GITHUB_OUTPUT"
          fi

  # A pull request runs ubuntu only: relay's workers already run the tests on Windows before done.
  # A push to main adds windows; the release step (docs/releasing.md) waits for that push run.
  test:
    needs: changes
    if: needs.changes.outputs.test == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -I tests/test_relay.py

  validate:
    needs: changes
    if: needs.changes.outputs.validate == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - run: npm i -g @anthropic-ai/claude-code
      - run: claude plugin validate .
